name: Capture academy review screens

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/capture-reviews.yml'
      - 'capture-review-pages.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academy-review-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Korean fonts and Playwright Chromium
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render and capture live review pages
        shell: bash
        run: node capture-review-pages.mjs

      - name: Commit generated evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures
          if git diff --cached --quiet; then
            echo "No generated files to commit"
          else
            git commit -m "Add academy review screenshots [skip ci]"
            git push origin HEAD:main
          fi
