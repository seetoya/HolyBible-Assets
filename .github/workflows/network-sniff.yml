name: Sniff review network APIs

on:
  push:
    branches:
      - tmp-review-capture-20260815
    paths:
      - '.github/workflows/network-sniff.yml'
      - 'network-sniff.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sniff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-review-capture-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Publish run ID
        shell: bash
        run: |
          mkdir -p .capture-state
          printf '%s\n' "$GITHUB_RUN_ID" > .capture-state/network-sniff-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .capture-state/network-sniff-run-id.txt
          git commit -m "Record review network sniff run ID [skip ci]"
          git push origin HEAD:tmp-review-capture-20260815

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Korean fonts and Playwright Chromium
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run network sniffer
        shell: bash
        run: |
          node --check network-sniff.mjs
          node network-sniff.mjs

      - name: Upload network logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-network-sniff
          path: network-sniff-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
