name: Capture every academy review individually

on:
  push:
    branches:
      - tmp-review-capture-20260815
    paths:
      - '.github/workflows/all-review-capture.yml'
      - 'all-review-capture.mjs.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-individual-review-captures
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-review-capture-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Publish workflow run ID
        shell: bash
        run: |
          mkdir -p .capture-state
          printf '%s\n' "$GITHUB_RUN_ID" > .capture-state/all-review-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .capture-state/all-review-run-id.txt
          git commit -m "Record all-review capture run ID [skip ci]"
          git push origin HEAD:tmp-review-capture-20260815

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Korean fonts and Playwright Chromium
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Restore capture script
        shell: bash
        run: |
          base64 -d all-review-capture.mjs.gz.b64 | gunzip > all-review-capture.mjs
          node --check all-review-capture.mjs

      - name: Capture every review as a separate PNG
        shell: bash
        run: node all-review-capture.mjs

      - name: Show capture inventory
        if: always()
        shell: bash
        run: |
          find all-review-output -type f -name '*.png' -printf '%p\t%s bytes\n' 2>/dev/null | sort || true
          cat all-review-output/_manifest.json 2>/dev/null || true

      - name: Persist capture files on temporary branch
        if: always()
        shell: bash
        run: |
          if [ ! -d all-review-output ]; then
            echo "No output directory"
            exit 0
          fi
          git add -A all-review-output
          if git diff --cached --quiet; then
            echo "No new output files"
          else
            git commit -m "Add all individual academy review screenshots [skip ci]"
            git push origin HEAD:tmp-review-capture-20260815
          fi

      - name: Upload individual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ericssam-all-individual-reviews
          path: all-review-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
