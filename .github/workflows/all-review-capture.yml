name: Capture every academy review individually

on:
  push:
    branches:
      - tmp-review-capture-20260815
    paths:
      - '.github/workflows/all-review-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-review-capture-20260815

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Korean fonts and Playwright Chromium
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Restore capture script
        shell: bash
        run: |
          cat <<'B64' | base64 -d | gunzip > /tmp/all-review-capture.mjs
          
          B64
          node --check /tmp/all-review-capture.mjs

      - name: Capture all individual reviews
        shell: bash
        run: node /tmp/all-review-capture.mjs

      - name: Show capture counts
        if: always()
        shell: bash
        run: |
          find all-review-output -type f -name '*.png' -printf '%p\t%s bytes\n' 2>/dev/null | sort || true
          cat all-review-output/_manifest.json 2>/dev/null || true

      - name: Upload individual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ericssam-all-individual-reviews
          path: all-review-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
