name: Final capture of every review individually

on:
  push:
    branches:
      - tmp-review-capture-20260815
    paths:
      - '.github/workflows/final-all-individual-reviews-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-review-capture-20260815
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Korean fonts and Playwright Chromium
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk zip
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run final capture payload
        id: capture
        shell: bash
        run: |
          set +e
          rm -rf FINAL_INDIVIDUAL_REVIEWS all-review-output individual-review-images final-review-output final-all-review-output review-card-output
          base64 -d final-all-review-capture.mjs.gz.b64 | gunzip > /tmp/final-all-review-capture.mjs
          node /tmp/final-all-review-capture.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect only individual review PNG files
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, os

          root = Path('.')
          dest = root / 'FINAL_INDIVIDUAL_REVIEWS'
          dest.mkdir(parents=True, exist_ok=True)
          skip = ('debug','failed','failure','fallback','fullpage','diagnostic','screenshot-page')
          candidates = []
          for p in root.rglob('*.png'):
              if '.git' in p.parts or 'FINAL_INDIVIDUAL_REVIEWS' in p.parts:
                  continue
              low = str(p).lower()
              if any(token in low for token in skip):
                  continue
              if not any(token in low for token in ('review','리뷰','후기','naver','daangn','ericssam')):
                  continue
              candidates.append(p)

          for p in candidates:
              parts = list(p.parts)
              # Preserve the meaningful hierarchy below a known output root.
              start = 0
              for marker in ('final-all-review-output','all-review-output','individual-review-images','final-review-output','review-card-output'):
                  if marker in parts:
                      start = parts.index(marker) + 1
                      break
              rel = Path(*parts[start:]) if start < len(parts) else Path(p.name)
              target = dest / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  target = target.with_name(f'{target.stem}_{abs(hash(str(p))) % 100000}{target.suffix}')
              shutil.copy2(p, target)

          files = sorted(dest.rglob('*.png'))
          print('COLLECTED_PNG_COUNT=', len(files))
          for p in files:
              print(p)
          (dest / '.count').write_text(str(len(files)), encoding='utf-8')
          PY

      - name: Build image-only ZIP packages
        if: always()
        shell: bash
        run: |
          count=$(cat FINAL_INDIVIDUAL_REVIEWS/.count 2>/dev/null || echo 0)
          rm -f ericssam_all_individual_reviews.zip ericssam_english_individual_reviews.zip ericssam_exam_english_individual_reviews.zip
          find FINAL_INDIVIDUAL_REVIEWS -name '.count' -delete
          zip -qr ericssam_all_individual_reviews.zip FINAL_INDIVIDUAL_REVIEWS
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('FINAL_INDIVIDUAL_REVIEWS')
          groups=[('ericssam_english_individual_reviews.zip','에릭쌤영어학원'),('ericssam_exam_english_individual_reviews.zip','에릭쌤입시영어학원')]
          for zname, needle in groups:
              with zipfile.ZipFile(zname,'w',zipfile.ZIP_DEFLATED) as z:
                  for p in root.rglob('*.png'):
                      if needle in str(p):
                          z.write(p,p.relative_to(root.parent))
          PY
          echo "$count" > FINAL_INDIVIDUAL_REVIEWS_COUNT.txt

      - name: Commit final images and packages
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINAL_INDIVIDUAL_REVIEWS FINAL_INDIVIDUAL_REVIEWS_COUNT.txt ericssam_all_individual_reviews.zip ericssam_english_individual_reviews.zip ericssam_exam_english_individual_reviews.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Add all individual academy review screenshots [skip ci]'
            git pull --rebase origin tmp-review-capture-20260815
            git push origin HEAD:tmp-review-capture-20260815
          fi

      - name: Enforce complete capture
        if: always()
        shell: bash
        run: |
          count=$(cat FINAL_INDIVIDUAL_REVIEWS_COUNT.txt 2>/dev/null || echo 0)
          echo "FINAL INDIVIDUAL REVIEW IMAGE COUNT: $count"
          test "$count" -ge 59
