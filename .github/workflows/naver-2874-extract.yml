name: Extract Naver pagination modules from bundle 2874

on:
  push:
    branches:
      - tmp-review-capture-20260815
    paths:
      - '.github/workflows/naver-2874-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-review-capture-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download, format and extract
        shell: bash
        run: |
          mkdir -p source-debug/naver-2874
          curl -L --retry 3 --fail 'https://g-place.pstatic.net/assets/place/place.2874.bundle.9b8a93d5756bf8ac28a9.1786610149950.js' -o /tmp/2874.js
          npx --yes prettier@3.6.2 /tmp/2874.js --parser babel > /tmp/2874.pretty.js
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          src=Path('/tmp/2874.pretty.js').read_text('utf-8',errors='replace')
          lines=src.splitlines()
          out=Path('source-debug/naver-2874')
          summary={}
          for term in ['92065','3608','reviewsLoadMore','visitorReviews','fetchMore','loadMoreOnClick']:
              hits=[i for i,l in enumerate(lines) if term in l]
              summary[term]=[i+1 for i in hits]
              chunks=[]
              for n,i in enumerate(hits):
                  chunks.append(f'===== {term} HIT {n+1} LINE {i+1} =====')
                  chunks.extend(lines[max(0,i-220):min(len(lines),i+380)])
              (out/f'{term}.txt').write_text('\n'.join(chunks),'utf-8')
          # Generic webpack-style module boundary extraction after formatting.
          starts=[]
          patterns=[
              re.compile(r'^\s*(\d+):\s*\('),
              re.compile(r'^\s*(\d+):\s*function\s*\('),
              re.compile(r'^\s*(\d+):\s*\w+\s*=>'),
          ]
          for i,l in enumerate(lines):
              for p in patterns:
                  m=p.search(l)
                  if m:
                      starts.append((i,m.group(1)))
                      break
          for mid in ['92065','3608']:
              candidates=[i for i,m in starts if m==mid]
              if not candidates: continue
              i=candidates[0]
              nxt=[j for j,_ in starts if j>i]
              j=min(nxt) if nxt else len(lines)
              (out/f'module_{mid}.txt').write_text('\n'.join(lines[i:j]),'utf-8')
              summary[f'module_{mid}_range']=[i+1,j]
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Commit extracts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-debug/naver-2874
          if ! git diff --cached --quiet; then
            git commit -m 'Add Naver 2874 pagination module extracts [skip ci]'
            git pull --rebase origin tmp-review-capture-20260815
            git push origin HEAD:tmp-review-capture-20260815
          fi
