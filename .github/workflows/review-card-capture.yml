name: Capture individual academy review cards

on:
  push:
    branches:
      - tmp-review-capture-20260815
    paths:
      - '.github/workflows/review-card-capture.yml'
      - 'review-card-capture.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-review-capture-20260815

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Korean fonts and Playwright Chromium
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture isolated review cards
        shell: bash
        run: node review-card-capture.mjs

      - name: Show outputs
        if: always()
        shell: bash
        run: find review-card-output -maxdepth 1 -type f -printf '%f\t%s bytes\n' 2>/dev/null || true

      - name: Upload review-card screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ericssam-review-card-captures
          path: review-card-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
